name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "image_name_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name_lc }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name_lc }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "image_name_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOYMENT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Copy docker-compose to host
        run: |
          rsync -azv -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            docker-compose.yml config/ \
            patchwork@ewr-container-001.vwire.net:~/object-api/

      - name: Copy config files
        run: |
          rsync -azv -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            config/config.prod.yaml \
            patchwork@ewr-container-001.vwire.net:~/object-api/config.prod.yaml

      - name: Log in to GHCR on host
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa patchwork@ewr-container-001.vwire.net \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy container
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa patchwork@ewr-container-001.vwire.net \
            'cd object-api && IMAGE_NAME=${{ env.REGISTRY }}/${{ steps.image.outputs.image_name_lc }} IMAGE_TAG=${{ github.sha }} docker compose pull && IMAGE_NAME=${{ env.REGISTRY }}/${{ steps.image.outputs.image_name_lc }} IMAGE_TAG=${{ github.sha }} docker compose up -d --force-recreate --no-deps'
